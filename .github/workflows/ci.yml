name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Stable, and the minimum go.mod claims. A module that says go 1.24
        # and has never been built with it is guessing.
        go: ["stable", "1.24.x"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      - run: go build ./...
      - run: go test ./... -count=1

  race:
    name: Race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true

      # The race detector needs cgo, which the author's Windows machine has no
      # C toolchain for, so this job is the only place it ever runs. Everything
      # in this repository that matters is concurrent - a proxy mutating link
      # state under live connections, servers replicating in the background -
      # so a green suite without this job would not be evidence of much.
      - run: go test ./... -race -count=1

  lint:
    name: Format and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...

      # The tool ships with no third-party code, and that claim should fail
      # loudly rather than quietly stop being true.
      - name: No dependencies
        run: |
          if [ -s go.sum ]; then echo "go.sum is not empty"; cat go.sum; exit 1; fi
          if grep -qE '^require' go.mod; then echo "go.mod has a require block"; cat go.mod; exit 1; fi

  demo:
    name: End-to-end demonstration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true

      # The repository's headline claim is that a correct store survives a
      # seeded partition schedule and a plausible-but-wrong one gets caught.
      # This runs that claim from scratch on a machine that is not the author's,
      # against the real binaries as separate operating-system processes, and
      # fails if either half stops being true.
      - run: go run ./tools/demo -out demo-artifacts

      - name: Upload the histories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-histories
          path: demo-artifacts/
          if-no-files-found: warn

  mutations:
    name: Mutation evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true

      # Breaks the checker and the harness a documented number of ways on
      # hardware that is not the author's, and fails if any mutation survives
      # or if the committed evidence no longer matches. A suite that stays
      # green while the code is wrong is decoration.
      - run: python3 tools/mutations.py
      - name: The committed evidence must match
        run: git diff --exit-code -- MUTATIONS.md

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The pinned binary over the whole history, not the action: the action
      # scans only the pushed range, so a secret committed once and never
      # touched again is invisible to it, and on a repository's first push it
      # fails outright because the root commit has no parent.
      - name: Install gitleaks 8.30.1
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan
        run: gitleaks detect --source . --redact --exit-code 1 --log-opts=--all
